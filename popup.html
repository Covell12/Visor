<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visor</title>
  <link rel="stylesheet" href="glass.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 292px;
      margin: 0;
      padding: 14px;
      font-family: 'Google Sans', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--page);
      overflow: hidden;
    }
    .p-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .p-head img { border-radius: 6px; }
    .p-head strong { font-size: 14.5px; letter-spacing: 0.2px; }
    .p-head span { display: block; font-size: 10.5px; color: var(--ink-3); }

    .p-card { padding: 12px; border-radius: var(--r-md); margin-bottom: 9px; }
    .p-status { display: flex; align-items: center; gap: 9px; font-size: 12px; }
    .p-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .p-dot-ok   { background: var(--good); }
    .p-dot-lock { background: var(--warm); }
    .p-dot-off  { background: var(--ink-3); }

    .p-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 620;
      color: #fff;
      background: var(--accent);
    }
    .p-btn:hover { filter: brightness(1.06); }
    .p-btn:disabled {
      cursor: default;
      color: var(--ink-3);
      background: var(--surface-3);
      border: 1px solid var(--hairline);
    }

    .p-facts { display: flex; flex-direction: column; gap: 7px; margin-top: 11px; }
    .p-fact { display: flex; gap: 8px; font-size: 11px; line-height: 1.45; color: var(--ink-2); }
    .p-fact b { color: var(--good); flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="p-head">
    <img src="logo.png" alt="" width="46" height="30">
    <div>
      <strong>Visor</strong>
      <span>Writing process analyzer</span>
    </div>
  </div>

  <div class="p-card glass">
    <div class="p-status">
      <span id="dot" class="p-dot p-dot-off"></span>
      <span id="status">Checking this tab…</span>
    </div>
  </div>

  <button id="open" class="p-btn" disabled>Open Visor</button>

  <div class="p-card glass" style="margin-top:11px">
    <div class="p-facts">
      <div class="p-fact"><b>✓</b> No sign-in, no Google API, no account.</div>
      <div class="p-fact"><b>✓</b> Reads only the document you have open, from its own page.</div>
      <div class="p-fact"><b>✓</b> Nothing is uploaded, stored remotely, or shared.</div>
      <div class="p-fact"><b>✓</b> Editors only — view-only access shows no history.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
